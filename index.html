<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>생약학2 중간고사 CBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* 배치: 시험장 PC 한 화면 — 상단 응시자 바 / 왼쪽 문제지(종이) / 오른쪽 OMR식 답안 표기란 / 하단 도구 바 */
:root{
  --ink:#1d2842; --ink-2:#2b3a5e; --on-ink:#eef2fa;
  --bg:#eceff4; --paper:#ffffff; --line:#d6dbe4; --line-strong:#b6bfce;
  --text:#1a2130; --muted:#5a6477;
  --accent:#2b58c9; --accent-soft:#e2e9fa; --accent-ink:#1c3c93; --on-accent:#ffffff;
  --seat:#a8c3f2;
  --check:#a86a12; --check-soft:#fcefd8; --check-ink:#7a4c08;
  --danger:#c0352b; --danger-soft:#fbe4e2; --on-danger:#ffffff;
  --ok:#1d8048;
  --hl:#fff08a; --hl-edge:#d9c23a;
  --shadow:rgba(20,30,60,.35);
  --font-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-q:'Noto Serif KR','AppleMyungjo','Batang',serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#0e1424; --ink-2:#1c2742; --on-ink:#e5eaf4;
  --bg:#111621; --paper:#1a2030; --line:#2b3346; --line-strong:#3e485f;
  --text:#e3e7ef; --muted:#9aa4b8;
  --accent:#86a8ff; --accent-soft:#223157; --accent-ink:#c3d3ff; --on-accent:#0d1630;
  --seat:#86a8ff;
  --check:#e3aa4c; --check-soft:#3a2d15; --check-ink:#f3cf8e;
  --danger:#ff7d71; --danger-soft:#3f1f1c; --on-danger:#2a0c09;
  --ok:#62d392;
  --hl:#6d5f12; --hl-edge:#a8921f;
  --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#0e1424; --ink-2:#1c2742; --on-ink:#e5eaf4;
  --bg:#111621; --paper:#1a2030; --line:#2b3346; --line-strong:#3e485f;
  --text:#e3e7ef; --muted:#9aa4b8;
  --accent:#86a8ff; --accent-soft:#223157; --accent-ink:#c3d3ff; --on-accent:#0d1630;
  --seat:#86a8ff;
  --check:#e3aa4c; --check-soft:#3a2d15; --check-ink:#f3cf8e;
  --danger:#ff7d71; --danger-soft:#3f1f1c; --on-danger:#2a0c09;
  --ok:#62d392;
  --hl:#6d5f12; --hl-edge:#a8921f;
  --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body,#app{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{text-wrap:balance}
.small{font-size:13px;color:var(--muted);margin:0;line-height:1.6}

/* 버튼 */
.btn{background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;padding:8px 16px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:11px 30px;font-weight:700;font-size:15px}
.btn-primary.big{font-size:17px;padding:13px 44px}
.btn-primary:disabled{background:var(--line-strong);color:var(--paper);opacity:1}

/* 상단 바 */
.top{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;background:var(--ink);color:var(--on-ink);padding:8px 16px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who small{display:block;font-size:12px;line-height:1.5;opacity:.9}
.seat{width:40px;height:40px;flex:none;border-radius:50%;background:var(--seat);color:var(--ink);display:grid;place-items:center;font:600 17px/1 var(--font-num)}
.ttl{flex:1;text-align:center;font-weight:600;font-size:15px;min-width:200px}
.clock{display:grid;grid-auto-flow:column;gap:14px;font:500 12px var(--font-num);font-variant-numeric:tabular-nums;opacity:.9}
.topreset{background:transparent;border:1px solid var(--on-ink);color:var(--on-ink);border-radius:6px;padding:5px 10px;font-size:12px;opacity:.8}
.topreset:hover{opacity:1}
.ctrls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:11px;line-height:1.25;opacity:.75;letter-spacing:.04em}
.seg{display:flex;gap:4px}
.seg button{background:var(--ink-2);border:1px solid transparent;color:var(--on-ink);border-radius:6px;min-width:42px;height:38px;padding:0 8px;display:grid;place-items:center;align-content:center;line-height:1.05}
.seg button[aria-pressed="true"]{background:var(--on-ink);color:var(--ink)}
.seg small{font-size:9px;opacity:.8;font-family:var(--font-num)}
.timer{display:flex;gap:14px;background:var(--ink-2);border-radius:8px;padding:6px 12px}
.timer div{display:grid;gap:3px;font-size:11px;opacity:.95}
.timer b{font:600 15px/1 var(--font-num);font-variant-numeric:tabular-nums}
.timer #tLeft{background:var(--on-ink);color:var(--ink);padding:3px 7px;border-radius:5px;margin-left:-7px}
.timer.warn #tLeft{background:var(--danger);color:var(--on-danger)}

/* 로그인 */
.center-wrap{min-height:100%;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px -22px var(--shadow)}
.login,.done{width:min(760px,100%);overflow:hidden}
.card-head{margin:0;background:var(--ink);color:var(--on-ink);text-align:center;padding:14px 16px;font-size:20px;font-weight:700}
.notice{margin:18px 24px 0;background:var(--bg);border-radius:8px;padding:14px;text-align:center;font-weight:600}
.login-grid{display:grid;grid-template-columns:180px 1fr;margin:18px 24px;border:1px solid var(--line)}
.photo{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.photo svg{width:112px;height:130px;color:var(--line-strong)}
.seatbig{width:108px;height:108px;border-radius:50%;background:var(--seat);color:var(--ink);display:grid;place-content:center;text-align:center;gap:2px}
.seatbig small{font-size:12px}
.seatbig b{font:600 40px/1 var(--font-num)}
.fields{display:grid;grid-template-columns:118px minmax(0,1fr);margin:0}
.fields > *{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;min-width:0;margin:0}
.fields > :nth-last-child(-n+2){border-bottom:0}
.fields .k{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.fields input{width:100%;box-sizing:border-box;border:1px solid var(--line-strong);background:var(--paper);color:var(--text);border-radius:4px;padding:8px 10px;font:inherit}
.demo{margin:0 24px;color:var(--muted);font-size:13px;line-height:1.65}
.card-foot{background:var(--bg);padding:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}

/* 시험 전 안내 */
.shell{display:grid;grid-template-rows:auto 1fr;height:100%}
.guide{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.gnav{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.gnav button{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:15px 20px;font-size:15px;color:var(--muted);display:flex;gap:10px;align-items:center}
.gnav .n{font:500 11px var(--font-num);opacity:.7}
.gnav button.done{color:var(--text)}
.gnav button[aria-current="step"]{background:var(--ink);color:var(--on-ink);font-weight:700}
.gmain{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}
.gmain h1{margin:0;padding:16px 28px;font-size:21px;border-bottom:1px solid var(--line);background:var(--paper);text-align:center}
.gbody{overflow:auto;padding:24px 28px}
.ginner{max-width:860px;margin:0 auto;display:grid;gap:16px}
.gfoot{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;background:var(--paper);border-top:1px solid var(--line)}
.gfoot .count{font:500 13px var(--font-num)}
.gfoot .hint{flex-basis:100%;text-align:center;color:var(--danger);font-size:13px;margin:0}
.lead{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:14px 18px;line-height:1.65}
.lead b{display:block;font-size:16px;margin-bottom:2px}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:grid;gap:8px}
.rules li{counter-increment:r;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 52px;position:relative;line-height:1.65}
.rules li::before{content:counter(r);position:absolute;left:16px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font:600 12px/1 var(--font-num)}
.agree{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;border:2px dashed var(--line-strong);border-radius:8px;font-weight:600;background:var(--paper);cursor:pointer;text-align:center}
.agree.ok{border-style:solid;border-color:var(--ok)}
.agree input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.pattern{background:#0b0d12;border-radius:8px;padding:16px;display:grid;gap:12px}
.bars{display:grid;grid-template-columns:repeat(6,1fr)}
.bars div{display:grid;gap:6px;text-align:center;font-weight:600;font-size:13px}
.bars i{display:block;height:40px}
.digits{display:flex;justify-content:space-around;font:700 26px/1.3 var(--font-ui);border-radius:6px;padding:4px 0}
.digits.light{background:#ffffff}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;align-content:start;line-height:1.5}
.box span{color:var(--muted);font-size:13px}
.box input{border:1px solid var(--line-strong);background:var(--paper);color:var(--text);border-radius:4px;padding:8px 10px;font:inherit}
.box .btn{justify-self:start}
.pledge{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px 24px;line-height:1.75;font-family:var(--font-q)}
.pledge h2{margin:0 0 8px;font-size:18px;text-align:center}
.pledge ol{padding-left:1.4em;margin:10px 0}
.pledge p{margin:8px 0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:6px 6px 0 0;padding:9px 18px;margin-bottom:-1px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--text)}
.practice{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.p-top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:var(--ink);color:var(--on-ink);padding:8px 14px}
.p-tag{font-weight:700;font-size:13px;margin-right:auto}
.timer .pt{font:600 13px/1 var(--font-ui);background:var(--on-ink);color:var(--ink);padding:3px 7px;border-radius:5px;margin-left:-7px}
.p-body{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.practice .qpage{overflow:visible}
.practice .qcol{overflow:visible}
.practice .bottom{border-top:1px solid var(--line)}
.try-wrap{display:grid;gap:8px}
.p-main{min-width:0;font-size:calc(16px * var(--qscale,1))}
.p-q{padding:20px 24px}
.p-side{border-left:1px solid var(--line);background:var(--bg);padding:14px;display:grid;gap:10px;align-content:start}
.sheet-mini{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet-mini h3{margin:0;background:var(--ink-2);color:var(--on-ink);font-size:13px;text-align:center;padding:8px}
.sheet-mini .row{padding:8px 10px 8px 0}
.try-h{margin:6px 0 0;font-weight:700;font-size:14px}
.try-h span{font:600 13px var(--font-num);color:var(--ok);margin-left:6px}
.try{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px 16px;font-size:13px}
.try li{box-sizing:border-box;min-width:0;display:flex;gap:8px;align-items:flex-start;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.try b{margin-right:4px}
.try li.done{border-color:var(--ok)}
.try li::before{content:'';flex:none;width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--line-strong);margin-top:1px}
.try li.done{color:var(--muted)}
.try li.done::before{content:'✓';background:var(--ok);border-color:var(--ok);color:var(--paper);font-size:11px;line-height:13px;text-align:center;font-weight:700}
.p-side .btn{justify-self:start;font-size:13px;padding:6px 12px}
@media (max-width:760px){.p-body,.practice .qpage.two{grid-template-columns:minmax(0,1fr)}.p-side{border-left:0;border-top:1px solid var(--line)}}
.sample{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px;font-size:15px;--qscale:.9}
.sample.case{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:0}
.feat div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.feat dt{font-weight:700;margin-bottom:4px}
.feat dd{margin:0;color:var(--muted);line-height:1.6;font-size:13px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;background:var(--paper);font-variant-numeric:tabular-nums;min-width:640px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:center}
.tbl thead th{background:var(--ink-2);color:var(--on-ink);font-weight:600;font-size:13px}
.tbl tbody tr:last-child td{border-bottom:0}
.waitbox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;display:grid;gap:14px;justify-items:center;text-align:center}
.waitbox .big{font-size:18px;font-weight:700;margin:0}
.waitbox p{margin:0;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:0;text-align:left}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

/* 문제풀이 */
.exam{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-height:560px}
.exam-body{display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:0}
.qarea{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0;background:var(--paper);font-size:calc(17px * var(--qscale,1))}
.qtool{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}
.plabel{margin-right:auto;font-family:var(--font-q);font-size:calc(19px * var(--qscale,1));font-weight:600;line-height:1.4}
.plabel span{display:block;font-size:.78em;font-weight:400;color:var(--muted)}
.hlbtn{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:6px 11px}
.hlbtn[aria-pressed="true"]{background:var(--hl);border-color:var(--hl-edge);color:var(--text);font-weight:600}
.qpage{display:grid;min-height:0;overflow:hidden}
.qpage.two,.qpage.case{grid-template-columns:1fr 1fr}
.qcol{overflow:auto;padding:22px 28px;min-width:0}
.qcol + .qcol{border-left:2px solid var(--line)}
.passage{border:1px solid var(--text);padding:14px 18px;line-height:1.8;font-family:var(--font-q)}
.passage p{margin:0 0 10px}
.ptable{border-collapse:collapse;width:100%;font-size:.94em}
.ptable th{text-align:left;font-weight:600;padding:3px 14px 3px 0;white-space:nowrap;vertical-align:top}
.ptable td{padding:3px 0}
.q{font-family:var(--font-q);display:grid;gap:10px;padding-bottom:26px;max-width:52em}
.q + .q{border-top:1px dashed var(--line-strong);padding-top:22px}
.q-line{display:flex;gap:8px;line-height:1.7}
.qno{font-weight:700;flex:none}
.stem{flex:1;min-width:0}
.q-tools{display:flex;gap:6px;font-family:var(--font-ui);font-size:12px}
.tool{border:1px solid var(--line-strong);background:var(--paper);border-radius:5px;padding:4px 10px}
.tool[aria-pressed="true"]{background:var(--check-soft);border-color:var(--check);color:var(--check-ink);font-weight:600}
.memo{display:grid;gap:4px;font-family:var(--font-ui);font-size:12px;color:var(--muted)}
.memo textarea{font:14px/1.5 var(--font-ui);color:var(--text);background:var(--check-soft);border:1px solid var(--check);border-radius:6px;padding:8px 10px;resize:vertical}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.opt{display:flex;align-items:center;gap:6px}
.pick{flex:1;min-width:0;display:flex;gap:10px;align-items:baseline;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 10px;font-family:var(--font-q);font-size:1em;line-height:1.55}
.pick:hover{background:var(--bg)}
.cn{flex:none;display:inline-grid;place-items:center;width:1.45em;height:1.45em;border:1px solid currentColor;border-radius:50%;font:600 .74em/1 var(--font-num);transform:translateY(-.08em)}
.opt.sel .pick{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.opt.sel .cn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.struck .ot{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.opt.struck .cn{opacity:.5}
.x{flex:none;font-family:var(--font-ui);font-size:11px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:3px 7px}
.x[aria-pressed="true"]{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
mark.hlm{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.hl-on .hl-zone{cursor:text}
.hl-on .hl-zone ::selection,.hl-on .hl-zone::selection{background:var(--hl)}

.sheet{background:var(--paper);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0}
.sheet h2{margin:0;background:var(--ink-2);color:var(--on-ink);text-align:center;font-size:15px;padding:12px}
.rows{overflow:auto;padding:6px 0}
.row{display:grid;grid-template-columns:50px repeat(5,1fr);align-items:center;padding:4px 12px 4px 0;gap:2px}
.row.gap{border-bottom:1px dashed var(--line-strong);padding-bottom:8px;margin-bottom:4px}
.row.cur{background:var(--accent-soft)}
.row.chk{background:var(--check-soft)}
.row.chk .rno{background:var(--check);color:var(--paper)}
.row.chk .flag{color:inherit}
.q.is-chk{border-left:4px solid var(--check);padding-left:14px;margin-left:-18px}
.rno{border:0;background:var(--bg);font:600 12px var(--font-num);height:28px;border-radius:0 5px 5px 0;display:flex;align-items:center;justify-content:center;gap:3px}
.flag{color:var(--check);font-size:11px}
.bub{justify-self:center;width:26px;height:26px;padding:0;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:600 11px/1 var(--font-num)}
.bub.on{background:var(--accent);color:var(--on-accent)}

.bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp.nav{margin:0 auto}
.fbtn{background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;padding:8px 12px;font-weight:500}
.fbtn[aria-pressed="true"]{background:var(--ink-2);color:var(--on-ink);border-color:var(--ink-2)}
.fbtn.submit{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.pgno{font:500 14px var(--font-num);min-width:60px;text-align:center}

#csvBox{width:100%;box-sizing:border-box;font:12px var(--font-num);background:var(--bg);color:var(--text);border:1px solid var(--line-strong);border-radius:6px;padding:8px}

<body>

<div id="app"></div>
<div id="modal-root"></div>

<section id="calc" class="float calc" hidden aria-label="계산기">
  <div class="float-head" data-drag><span>계산기</span><button data-act="calc">닫기</button></div>
  <div class="calc-disp"><small id="calcExpr"></small><span id="calcDisp">0</span></div>
  <div class="calc-keys">
    <button data-act="ck" data-k="C">C</button><button data-act="ck" data-k="back" aria-label="한 글자 지우기">←</button><button data-act="ck" data-k="neg" aria-label="부호 바꾸기">±</button><button class="op" data-act="ck" data-k="/">÷</button>
    <button data-act="ck" data-k="7">7</button><button data-act="ck" data-k="8">8</button><button data-act="ck" data-k="9">9</button><button class="op" data-act="ck" data-k="*">×</button>
    <button data-act="ck" data-k="4">4</button><button data-act="ck" data-k="5">5</button><button data-act="ck" data-k="6">6</button><button class="op" data-act="ck" data-k="-">−</button>
    <button data-act="ck" data-k="1">1</button><button data-act="ck" data-k="2">2</button><button data-act="ck" data-k="3">3</button><button class="op" data-act="ck" data-k="+">+</button>
    <button data-act="ck" data-k="sqrt" aria-label="제곱근">√</button><button data-act="ck" data-k="0">0</button><button data-act="ck" data-k=".">.</button><button class="eq" data-act="ck" data-k="=">=</button>
  </div>
</section>

<section id="draw" class="float draw" hidden aria-label="그림판">

    <button class="tool" data-act="pen" aria-pressed="true">펜</button>
    <button class="tool" data-act="eraser" aria-pressed="false">지우개</button>
    <button class="tool" data-act="dclear">모두 지우기</button>
    <span class="small">그림판 내용은 채점하지 않습니다.</span>
  </div>
  <canvas id="pad" width="1200" height="760"></canvas>
</section>

<script>
/* ───────── 시험 설정: 학과 상황에 맞게 이 부분만 고치면 됩니다 ───────── */
const EXAM = {
  code: 'PHG2-MID',     // 답안 코드 앞머리. 채점 페이지의 시험 코드와 같아야 함
  dept: '약학과',
  title: '생약학2 중간고사',
  session: '',          // 교시가 없으면 빈 문자열
  subjects: '생약학2',
  minutes: 90,          // 제한 시간(분)
  enter: '08:50',       // 입실 완료 시각
  start: '09:00',       // 시험 시작 시각(시간표 표시용)
  collect: '5분',
  authCode: '',         // 시험인증번호 4자리. 비우면 아무 4자리나 통과
  allowReset: true      // 시험 삼아 돌려 볼 때만 true. 실제 시행은 false
};

/* 문항: 정답은 넣지 않는다(실제 시험 모드). 채점은 교수용 채점 페이지에서 한다.
   단일정답형 {stem, options[5]}, 사례형 {id, passage, questions[]} */
const UNITS = [
  { stem: "이명법 (Binominal nomenclature)에 대한 설명으로 <b class=\"neg\">옳지 않은</b> 것은?",
    options: ["학명을 사용하는 이유는 생물을 명확하게 지칭하기 위해서이다.", "속명은 명사형, 종소명은 속명에 대한 수식어 형태로 붙는다.", "종소명이 같은 경우 같은 종의 생물이다.", "속명과 종명은 이탤릭체로 표기한다.", "후대의 연구로 학명이 바뀔 수 있다."] },
  { stem: "근류 생약 및 그 부위에 대한 설명으로 <b class=\"neg\">옳지 않은</b> 것은?",
    options: ["식물의 뿌리를 약용부분으로 하는 생약이다.", "영양분을 저장하고 있는 비대한 뿌리를 저장근이라 한다.", "저장근 중 덩어리 모양으로 생긴 것을 괴근이라 한다.", "저장근 만을 생약으로 사용한다.", "감초의 경우 뿌리껍질을 제거한 후 사용한다."] },
  { stem: "<i>Pueraria lobate</i> 의 뿌리 혹은 주피를 제거한 뿌리로 puerarin, daidzein, daidzin등의 isoflavonoid를 주성분으로 함유하고 있으며 해열, 발한, 진경작용이 있어 한방에서 감기약으로 사용되는 이 생약은 무엇인가?",
    options: ["갈근", "길경", "강활", "오약", "파극천"] },
  { stem: "노니 (Noni) 와 같은 속의 식물로 항우울 및 강장 작용이 있으며 근류 생약인 파극천의 기원식물인 이것의 학명은 무엇인가?",
    options: ["<i>Morinda citrifolia</i>", "<i>Astragalus membranaceus</i>", "<i>Morinda officinalis</i>", "<i>Polygonum multiflorum</i>", "<i>Cynanchum wilfordii</i>"] },
  { stem: "<i>Scrophularia buergeriana</i>를 기원식물로 하며 뇌신경보호작용이 있는 이 근류 생약의 이름은 무엇인가?",
    options: ["현삼", "갈화", "백수오", "승마", "황금"] },
  { stem: "다음 중 인삼의 기원식물은 무엇인가?",
    options: ["<i>Panax ginseng</i>", "<i>Panax notoginseng</i>", "<i>Panax quinquefolium</i>", "<i>Panax japonicas</i>", "<i>Panax pseudoginseng</i>"] },
  { stem: "<i>Paeonia lactiflora</i>를 기원식물로 하는 생약에 대한 설명으로 <b class=\"neg\">옳지 않은</b> 것은?",
    options: ["건조한 것은 정량할 때 albiflorin 및 paeoniflorin을 2.3% 이상 함유한다.", "작약감초탕의 주성분이다.", "진경, 진통 효과가 있다.", "혈소판 응집을 억제하고 구어혈 작용을 한다.", "단맛이 나는 saponin을 함유하고 있어 천연 감미료로 활용된다."] },
  { stem: "<i>Rehmannia glutinosa</i> 또는 기타 동속식물의 뿌리를 포제 가공한 것으로 보혈, 강장의 효능이 있으며 정량할때 5-hydromethyl-2-frualdehyde를 0.1% 이상 함유하고 있는 이 생약의 이름은?",
    options: ["홍삼", "숙지황", "황기", "하수오", "토근"] },
  { stem: "민족두리풀 및 서울족두리풀을 기원식물로 하며 소청룡탕의 재료로 감기나 축농증에 효과가 있는 것으로 알려져 있으나 독성물질인 aristolochic acid I의 함유로 인해 엄격한 관리가 이루어지고 있는 이 생약의 생약명은?",
    options: ["Dipsaci Radix", "Asari Radix", "Puerariae Radix", "Phlomidis Radix", "Linderae Radix"] },
  { stem: "Gentiopicroside 등의 Iridoid glycoside를 주성분으로 함유하고 있으며 <i>Gentiana scabra</i>를 기원식물로 하는 고미건위 생약은 무엇인가?",
    options: ["겐티아나근", "시호", "용담", "칼룸바", "토근"] }
];
/* ─────────────────────────────────────────────────────────────── */

const QUESTIONS = [];
UNITS.forEach(u => {
  const list = u.passage ? u.questions : [u];
  u.nos = list.map(q => { const no = QUESTIONS.length + 1; QUESTIONS.push({ ...q, no }); return no; });
});
const TOTAL = QUESTIONS.length;
/* 문항형태 단계의 연습용 예제. 번호를 0 이하로 두어 채점과 답안 코드에서 빠진다 */
const PRACTICE = [
  { no: 0, label: '예제 1', answer: 2,
    stem: '알칼로이드(alkaloid)는 분자 안에 질소 원자를 가진 염기성 천연 유기화합물이다. 다음 중 알칼로이드에 해당하는 성분은?',
    options: ['글루코스(glucose)', '모르핀(morphine)', '셀룰로스(cellulose)', '스테아르산(stearic acid)', '콜레스테롤(cholesterol)'] },
  { no: -1, label: '예제 2', answer: 4,
    stem: '생약의 약용 부위를 나타내는 라틴어 가운데 "뿌리"를 뜻하는 것은?',
    options: ['Folium', 'Flos', 'Fructus', 'Radix', 'Semen'] }
];
const PNOS = PRACTICE.map(p => p.no);
const Q = no => no <= 0 ? PRACTICE[-no] : QUESTIONS[no - 1];
const KEY = 'phg2-mid-cbt-v1';
const SESS = EXAM.session ? ' · ' + EXAM.session : '';

function fresh() {
  return { stage: 'login', user: { id: '', name: '' }, guide: 0, guideMax: 0, agree: { screen: false, secret: false },
    answers: {}, struck: {}, checked: {}, memo: {}, hl: {}, ptry: {}, page: 0, scale: 1, cols: 1, filter: 'all', hlOn: false,
    startAt: null, endAt: null, submittedAt: null, auto: false, warned: false };
}
let S = fresh();
if (EXAM.allowReset && /[?&]reset\b/.test(location.search)) {
  try { localStorage.removeItem(KEY); } catch (e) {}
  history.replaceState(null, '', location.pathname);
}
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let PAGES = [], ppage = 0, pfilter = 'all', pSubmitOpen = false, memoOpen = null, typeTab = 0, clicks = 0, submitOpen = false, resetArm = false;
const app = document.getElementById('app');
const pad2 = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}분 ${pad2(s % 60)}초`; };
const endClock = () => { const [h, m] = EXAM.start.split(':').map(Number); const t = h * 60 + m + EXAM.minutes; return `${pad2(Math.floor(t / 60) % 24)}:${pad2(t % 60)}`; };
const seat = (id = S.user.id) => { const d = String(id || '').replace(/\D/g, ''); return d ? d.slice(-2).padStart(2, '0') : '--'; };

function buildPages() {
  const pages = []; let buf = [];
  const flush = () => { if (buf.length) { pages.push({ kind: 'single', units: buf }); buf = []; } };
  UNITS.forEach(u => {
    if (u.passage) { flush(); pages.push({ kind: 'case', units: [u] }); }
    else { buf.push(u); if (buf.length >= S.cols) flush(); }
  });
  flush();
  return pages;
}
const pageOf = no => PAGES.findIndex(p => p.units.some(u => u.nos.includes(no)));

/* ───── 화면 ───── */
function render() {
  if (S.stage === 'login') app.innerHTML = loginView();
  else if (S.stage === 'guide') app.innerHTML = guideView();
  else if (S.stage === 'exam') {
    PAGES = buildPages();
    S.page = Math.max(0, Math.min(S.page, PAGES.length - 1));
    app.innerHTML = examView();
  } else app.innerHTML = doneView();
  if (S.stage !== 'exam' && S.stage !== 'guide') { document.getElementById('calc').hidden = true; document.getElementById('draw').hidden = true; }
  modalRender();
  tick();
}

function segsHTML(colsAct) {
  const fs = [[0.8, '80%', 12], [1, '100%', 15], [1.25, '125%', 18]].map(([v, l, px]) =>
    `<button data-act="font" data-v="${v}" aria-pressed="${S.scale === v}" aria-label="글자 크기 ${l}"><span style="font-size:${px}px;font-weight:700">가</span><small>${l}</small></button>`).join('');
  const cols = [[1, '1단'], [2, '2단']].map(([v, l]) => `<button data-act="${colsAct}" data-v="${v}" aria-pressed="${S.cols === v}">${l}</button>`).join('');
  return `<div class="ctrl-group"><span class="ctrl-label">글자<br>크기</span><div class="seg">${fs}</div></div>
    <div class="ctrl-group"><span class="ctrl-label">화면<br>배치</span><div class="seg">${cols}</div></div>`;
}
function topbar(exam) {
  const who = `<div class="who"><span class="seat" aria-label="좌석번호">${seat()}</span><div><small>수험번호 ${esc(S.user.id)}</small><small>성명 ${esc(S.user.name)}</small></div></div>`;
  const ttl = `<div class="ttl">${EXAM.dept} ${EXAM.title}${SESS}</div>`;
  const rst = EXAM.allowReset ? '<button class="topreset" data-act="reset" title="검토용: 저장된 진행 상태를 지우고 로그인 화면으로">처음부터</button>' : '';
  if (!exam) return `<header class="top">${who}${ttl}<div class="clock"><span>${today()}</span><span data-clock></span><span>시작 ${EXAM.start}</span></div>${rst}</header>`;
  return `<header class="top">${who}${ttl}<div class="ctrls">${segsHTML('cols')}
    <div class="timer" role="timer"><div><span>제한 시간</span><b>${EXAM.minutes}분</b></div><div><span>남은 시간</span><b id="tLeft">--</b></div></div>
  ${rst}</div></header>`;
}

function loginView() {
  return `<div class="center-wrap"><section class="card login">
  <h1 class="card-head">응시자 로그인</h1>
  <p class="notice">감독관이 입실할 때까지 자리에서 기다려 주세요.</p>
  <div class="login-grid">
    <div class="photo">
      <svg viewBox="0 0 120 140" aria-hidden="true"><rect width="120" height="140" rx="4" fill="currentColor" opacity=".25"/><circle cx="60" cy="52" r="26" fill="currentColor"/><path d="M14 140c4-34 22-50 46-50s42 16 46 50z" fill="currentColor"/></svg>
      <div class="seatbig"><small>좌석번호</small><b id="seatPreview">${seat()}</b></div>
    </div>
    <form id="loginForm" class="fields" autocomplete="off">

/* 답안 코드: 시험코드|수험번호|성명|제출시각|답(1~5, 미응답 0)|확인코드. 채점 페이지가 확인코드를 다시 계산해 대조한다 */
function fnv(str) { let h = 0x811c9dc5; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36).padStart(7, '0'); }
function answerCode() {
  const clean = v => String(v).replace(/[|\r\n]/g, ' ').trim();
  const body = [EXAM.code, clean(S.user.id), clean(S.user.name), new Date(S.submittedAt || Date.now()).toISOString().slice(0, 19), QUESTIONS.map(q => S.answers[q.no] || 0).join('')].join('|');
  return body + '|' + fnv(body);
}

    </div>
    <div class="card-foot" style="margin-top:0"><button class="btn-primary" data-act="copy">답안 코드 복사</button>${EXAM.allowReset ? '<button class="btn" data-act="reset">처음부터 다시</button>' : ''}</div>
  </section></div>`;

function go(i) {
  if (i < 0 || i >= PAGES.length) return;
  S.page = i; memoOpen = null; save(); render();
}
function choose(no, o) {
  S.answers[no] === o ? delete S.answers[no] : (S.answers[no] = o);
  save(); updateQ(no); updateRow(no); refreshCounts(); refreshTry();
}
function submit(auto) {

function tick() {

  if (left <= 300000 && left > 0 && !S.warned) { S.warned = true; save(); toast('시험 종료 5분 전입니다.'); }
  if (left <= 0) submit(true);
}
setInterval(tick, 500);

const C = { cur: '0', acc: null, op: null, fresh: true };
const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const fmt = n => Number.isFinite(n) ? String(parseFloat(n.toPrecision(12))) : '오류';
const apply = (a, b, op) => op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : a / b;
function calcKey(k) {
  if (C.cur === '오류' && k !== 'C') { C.cur = '0'; C.acc = null; C.op = null; C.fresh = true; }
  if (/^\d$/.test(k)) { C.cur = (C.fresh || C.cur === '0') ? k : C.cur + k; C.fresh = false; }
  else if (k === '.') { if (C.fresh) { C.cur = '0.'; C.fresh = false; } else if (!C.cur.includes('.')) C.cur += '.'; }
  else if (k === 'C') { C.cur = '0'; C.acc = null; C.op = null; C.fresh = true; }
  else if (k === 'back') { if (!C.fresh) C.cur = C.cur.length > 1 ? C.cur.slice(0, -1) : '0'; }
  else if (k === 'neg') { C.cur = fmt(-parseFloat(C.cur)); }
  else if (k === 'sqrt') { C.cur = fmt(Math.sqrt(parseFloat(C.cur))); C.fresh = true; }
  else if (k in OPS) {
    if (C.op && !C.fresh) { C.acc = apply(C.acc, parseFloat(C.cur), C.op); C.cur = fmt(C.acc); }
    else if (!C.op) C.acc = parseFloat(C.cur);
    C.op = k; C.fresh = true;
  } else if (k === '=' && C.op) {
    C.cur = fmt(apply(C.acc, parseFloat(C.cur), C.op)); C.op = null; C.acc = null; C.fresh = true;
  }
  document.getElementById('calcDisp').textContent = C.cur;
  document.getElementById('calcExpr').textContent = C.op ? `${fmt(C.acc)} ${OPS[C.op]}` : '';
}

const pad = document.getElementById('pad'), ctx = pad.getContext('2d');
let penTool = 'pen', drawing = false;
const padPos = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
pad.addEventListener('pointerdown', e => {
  drawing = true; pad.setPointerCapture(e.pointerId);
  const [x, y] = padPos(e);
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = penTool === 'eraser' ? 'destination-out' : 'source-over';
  ctx.lineWidth = penTool === 'eraser' ? 30 : 4;
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#1a2130';
});
pad.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = padPos(e); ctx.lineTo(x, y); ctx.stroke(); });
['pointerup', 'pointercancel'].forEach(t => pad.addEventListener(t, () => { drawing = false; }));

function toggleFloat(id) {
  const el = document.getElementById(id);
  el.hidden = !el.hidden;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  const holder = b.closest('[data-q]');
  const qn = +(b.dataset.q || (holder && holder.dataset.q) || 0);
  switch (act) {
    case 'gstep': S.guide = +b.dataset.i; save(); render(); break;
    case 'gprev': S.guide = Math.max(0, S.guide - 1); save(); render(); break;
    case 'gnext': S.guide = Math.min(STEPS.length - 1, S.guide + 1); S.guideMax = Math.max(S.guideMax, S.guide); save(); render(); break;
    case 'clicktest': clicks++; document.getElementById('clickN').textContent = clicks; break;
    case 'ttab': typeTab = +b.dataset.i; render(); break;
    case 'start':
      PNOS.forEach(n => { [S.answers, S.struck, S.checked, S.memo].forEach(o => { delete o[n]; }); delete S.hl['s' + n]; });
      S.hlOn = false; S.filter = 'all'; memoOpen = null; ppage = 0; pfilter = 'all'; pSubmitOpen = false;
      ctx.clearRect(0, 0, pad.width, pad.height); document.getElementById('calc').hidden = true; document.getElementById('draw').hidden = true;
      S.stage = 'exam'; S.startAt = Date.now(); S.endAt = S.startAt + EXAM.minutes * 60000; S.page = 0; S.warned = false; save(); render(); break;
    case 'font': S.scale = +b.dataset.v; if (S.stage === 'guide') S.ptry.font = true; save(); render(); break;
    case 'pcols': S.cols = +b.dataset.v; if (S.cols === 2) S.ptry.cols = true; ppage = 0; memoOpen = null; save(); render(); break;
    case 'pprev': case 'pnext':
      ppage = Math.max(0, Math.min(PRACTICE.length - 1, ppage + (act === 'pnext' ? 1 : -1))); S.ptry.nav = true; memoOpen = null; save(); render(); break;
    case 'pfilter': pfilter = b.dataset.f; if (pfilter !== 'all') S.ptry.filter = true; save(); render(); break;
    case 'psubmit': pSubmitOpen = true; markTry('submit'); modalRender(); break;
    case 'psub-cancel': pSubmitOpen = false; modalRender(); if (b.textContent.includes('제출')) toast('연습이므로 제출되지 않았습니다.', 'info'); break;
    case 'cols': {
      const first = PAGES[S.page].units[0].nos[0];
      S.cols = +b.dataset.v; PAGES = buildPages(); S.page = Math.max(0, pageOf(first)); save(); render(); break;
    }
    case 'pick': choose(qn, +b.dataset.o); break;
    case 'strike': {
      const o = +b.dataset.o, list = S.struck[qn] || [];
      S.struck[qn] = list.includes(o) ? list.filter(x => x !== o) : [...list, o];
      save(); updateQ(qn); refreshTry(); break;
    }
    case 'check': S.checked[qn] = !S.checked[qn]; save(); updateQ(qn); updateRow(qn); refreshCounts(); refreshTry(); break;
    case 'pans': toast(PRACTICE.map(p => `${p.label} 정답: ${p.answer}번 ${p.options[p.answer - 1]}`).join(' · '), 'info'); break;
    case 'memo': {
      memoOpen = memoOpen === qn ? null : qn; updateQ(qn);
      const ta = document.getElementById('memo-' + qn); if (ta) ta.focus();
      break;
    }
    case 'prev': go(S.page - 1); break;
    case 'next': go(S.page + 1); break;
    case 'goto': {
      if (qn <= 0) { if (S.cols === 1) ppage = -qn; S.ptry.nav = true; memoOpen = null; save(); render(); break; }
      const i = pageOf(qn); if (i !== S.page) go(i);
      const el = document.getElementById('q' + qn); if (el) el.scrollIntoView({ block: 'nearest' });
      break;
    }
    case 'filter':
      S.filter = b.dataset.f; save();
      document.getElementById('rows').innerHTML = QUESTIONS.map(rowHTML).join('');
      document.querySelectorAll('[data-act="filter"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === S.filter));
      break;
    case 'submit': submitOpen = true; modalRender(); break;
    case 'sub-cancel': submitOpen = false; modalRender(); break;
    case 'sub-ok': submit(false); break;
    case 'hl': S.hlOn = !S.hlOn; save(); render(); break;
    case 'hlclear':
      document.querySelectorAll('.qarea .hl-zone, .practice .hl-zone').forEach(z => delete S.hl[z.dataset.hl]);
      save(); render(); break;
    case 'calc': toggleFloat('calc'); markTry('calc'); break;
    case 'draw': toggleFloat('draw'); markTry('draw'); break;
    case 'ck': calcKey(b.dataset.k); break;
    case 'pen': case 'eraser':
      penTool = act;
      document.querySelectorAll('.draw-tools [data-act="pen"],.draw-tools [data-act="eraser"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.act === act));
      break;
    case 'dclear': ctx.clearRect(0, 0, pad.width, pad.height); break;
    case 'copy': {
      const text = answerCode();
      const box = document.getElementById('csvBox');
      const fallback = () => { box.focus(); box.select(); toast('자동 복사가 막혀 있습니다. 선택된 글자를 직접 복사하세요.', 'info'); };
      try { navigator.clipboard.writeText(text).then(() => toast('답안 코드를 복사했습니다.', 'info'), fallback); } catch (err) { fallback(); }
      break;
    }
    case 'reset':
      if (!resetArm) {
        resetArm = true; const label = b.textContent; b.textContent = '한 번 더 누르면 초기화';
        setTimeout(() => { resetArm = false; if (b.isConnected) b.textContent = label; }, 4000);
      } else {
        resetArm = false; S = fresh(); clicks = 0; typeTab = 0; ctx.clearRect(0, 0, pad.width, pad.height); save(); render();
      }
      break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.memo) {
    const n = +t.dataset.memo; S.memo[n] = t.value; save();
    const mb = document.querySelector(`#q${n} [data-act="memo"]`);
    if (mb) mb.textContent = '메모' + (t.value.trim() ? ' ●' : '');
    refreshTry();
  }
  if (t.closest && t.closest('#loginForm')) validateLogin();
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.agree;
  if (k) { S.agree[k] = e.target.checked; save(); render(); const cb = document.getElementById('ag-' + k); if (cb) cb.focus(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  if (!validateLogin()) return;
  S.user = { id: document.getElementById('f-id').value.trim(), name: document.getElementById('f-name').value.trim() };
  S.stage = 'guide'; S.guide = 0; save(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (submitOpen || pSubmitOpen)) { submitOpen = false; pSubmitOpen = false; modalRender(); return; }
  if (S.stage !== 'exam' || submitOpen) return;
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(S.page + 1);
  if (e.key === 'ArrowLeft') go(S.page - 1);
});

/* 형광펜: 한 문단 안에서 드래그한 부분을 <mark>로 감싸고 문항별로 저장 */
function applyHighlight() {
  if (!S.hlOn || (S.stage !== 'exam' && S.stage !== 'guide')) return;
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  const node = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  const zone = node.closest('.hl-zone');
  if (!zone || !zone.closest('.qarea, .practice')) return;
  if (r.cloneContents().querySelector('p,div,table,tbody,tr,td,th,li,ol,ul')) { toast('형광펜은 한 줄(한 칸) 안에서만 칠할 수 있습니다.', 'info'); return; }
  const mark = document.createElement('mark');
  mark.className = 'hlm';
  try { mark.appendChild(r.extractContents()); r.insertNode(mark); } catch (err) { return; }
  sel.removeAllRanges();
  S.hl[zone.dataset.hl] = zone.innerHTML; save(); refreshTry();
}
document.addEventListener('pointerup', () => setTimeout(applyHighlight, 0));
document.addEventListener('keyup', e => { if (e.shiftKey) applyHighlight(); });

/* 계산기·그림판 창 끌어 옮기기 */
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (!h || e.target.closest('button')) return;
  const p = h.parentElement, r = p.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  p.style.bottom = 'auto';
  const mv = ev => {
    p.style.left = Math.max(0, Math.min(innerWidth - r.width, ev.clientX - ox)) + 'px';
    p.style.top = Math.max(0, Math.min(innerHeight - 40, ev.clientY - oy)) + 'px';
  };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
});

render();
</script>
